<!DOCTYPE html>
<html lang='de'>
<head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>Anmeldetest</title></head>
<body>
<h1>Anmeldetest</h1>
<pre id='out'>Lade …</pre>
<script src='msal-browser.min.js'></script>
<script>
const CFG = {
  clientId: '0fb63a5b-1b13-4e0a-8557-2539b2b96258',
  tenantId: 'a1401f5e-c83f-4acf-adcb-93291e8b26aa',
  siteHost: 'rosengutde.sharepoint.com',
  sitePath: '/sites/Reparaturen'
};
const SCOPES = ['User.Read', 'Sites.ReadWrite.All'];
const out = document.getElementById('out');
(async () => {
  const app = new msal.PublicClientApplication({
    auth: {
      clientId: CFG.clientId,
      authority: 'https://login.microsoftonline.com/' + CFG.tenantId,
      redirectUri: location.origin + location.pathname
    },
    cache: { cacheLocation: 'localStorage' }
  });
  await app.initialize();
  const r = await app.handleRedirectPromise();
  const acc = (r && r.account) || app.getAllAccounts()[0];
  if (!acc) { await app.loginRedirect({ scopes: SCOPES }); return; }
  let tok;
  try { tok = await app.acquireTokenSilent({ scopes: SCOPES, account: acc }); }
  catch (e) { await app.acquireTokenRedirect({ scopes: SCOPES, account: acc }); return; }
  const g = async (u) => {
    const x = await fetch('https://graph.microsoft.com/v1.0' + u, { headers: { Authorization: 'Bearer ' + tok.accessToken } });
    return x.json();
  };
  const me = await g('/me');
  const site = await g('/sites/' + CFG.siteHost + ':' + CFG.sitePath);
  const lists = site.id ? await g('/sites/' + site.id + '/lists?$select=displayName') : null;
  out.textContent = JSON.stringify({
    angemeldet: me.displayName || me.error,
    mail: me.mail,
    website: site.displayName || site.error,
    listen: lists && lists.value ? lists.value.map(l => l.displayName) : lists
  }, null, 2);
})().catch(e => { out.textContent = 'Fehler: ' + e.message; });
document.getElementById('testWrite').addEventListener('click', async () => {
  const result = document.getElementById('testResult');
  result.textContent = 'Test wird ausgeführt ...';

  try {
    const accounts = msalInstance.getAllAccounts();
    const account = accounts[0];

    if (!account) {
      throw new Error('Bitte zuerst anmelden.');
    }

    const token = await msalInstance.acquireTokenSilent({
      scopes: ['Sites.ReadWrite.All'],
      account
    });

    const siteResponse = await fetch(
      'https://graph.microsoft.com/v1.0/sites/' +
      CFG.siteHost + ':' + CFG.sitePath,
      {
        headers: {
          Authorization: 'Bearer ' + token.accessToken
        }
      }
    );

    const site = await siteResponse.json();

    if (!site.id) {
      throw new Error('SharePoint-Website nicht gefunden: ' +
        JSON.stringify(site));
    }

    const listsResponse = await fetch(
      `https://graph.microsoft.com/v1.0/sites/${site.id}/lists?$select=id,displayName`,
      {
        headers: {
          Authorization: 'Bearer ' + token.accessToken
        }
      }
    );

    const lists = await listsResponse.json();
    const casesList = lists.value.find(l => l.displayName === 'Fälle');

    if (!casesList) {
      throw new Error('Die Liste „Fälle“ wurde nicht gefunden.');
    }

    const createResponse = await fetch(
      `https://graph.microsoft.com/v1.0/sites/${site.id}/lists/${casesList.id}/items`,
      {
        method: 'POST',
        headers: {
          Authorization: 'Bearer ' + token.accessToken,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          fields: {
            Title: 'TEST – Reparaturmeldung',
            Bereich: 'Sonstiges',
            Beschreibung: 'Automatischer Schreibtest',
            Prioritaet: 'Mittel',
            Status: 'Neu',
            Melder: account.username,
            MelderName: account.name || account.username
          }
        })
      }
    );

    const created = await createResponse.json();

    if (!createResponse.ok) {
      throw new Error(JSON.stringify(created.error || created));
    }

    result.textContent =
      'Erfolgreich angelegt! SharePoint-ID: ' + created.id;

  } catch (error) {
    result.textContent = 'Fehler: ' + error.message;
  }
});
</script>
  <div style="padding:20px">
  <h2>SharePoint-Schreibtest</h2>
  <button id="testWrite" type="button">
    Testfall in SharePoint anlegen
  </button>
  <pre id="testResult"></pre>
</div>
</body>
</html>
