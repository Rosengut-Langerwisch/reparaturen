
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rosengut – Reparaturmeldungen</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 48px auto;
      padding: 0 20px;
      color: #222;
    }

    h1 {
      color: #006338;
    }

    label {
      display: block;
      margin: 24px 0 8px;
      font-weight: bold;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #aaa;
      border-radius: 4px;
    }

    button {
      margin-top: 16px;
      padding: 12px 18px;
      background: #006338;
      color: white;
      border: 0;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    #meldung {
      margin-top: 20px;
      line-height: 1.5;
    }

    .hinweis {
      margin-top: 24px;
      padding: 12px;
      background: #f2f2f2;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Reparaturmeldungen</h1>
  <p>Bitte gib deine E-Mail-Adresse ein, um den Test zu starten.</p>

  <form id="loginForm">
    <label for="email">Deine E-Mail-Adresse</label>
    <input
      id="email"
      name="email"
      type="email"
      placeholder="name@rosengut.de"
      required
    >
    <button type="submit">Weiter</button>
  </form>

  <div id="meldung" aria-live="polite"></div>

  <div class="hinweis">
    <strong>Testmodus:</strong> Die E-Mail-Adresse wird hier noch
    nicht überprüft und nicht gespeichert. Bitte keine echten
    Reparaturdaten oder vertraulichen Informationen eingeben.
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const emailFeld = document.getElementById('email');
    const meldung = document.getElementById('meldung');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const email = emailFeld.value.trim();

      if (!emailFeld.checkValidity() || !email) {
        meldung.textContent = 'Bitte gib eine gültige E-Mail-Adresse ein.';
        return;
      }

      meldung.textContent = 'Test gestartet für: ' + email;

      // Vorläufig nur ein lokaler Test.
      // Noch keine Anmeldung und keine Datenspeicherung.
      console.log('Testbenutzer:', email);
    });
  </script>
</body>
</html>
