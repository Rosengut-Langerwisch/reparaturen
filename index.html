
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reparaturmeldungen – Schreibtest</title>
</head>

<body>
  <h1>Anmeldetest</h1>
  <pre id="out">Lade …</pre>

  <hr>

  <h2>SharePoint-Schreibtest</h2>
  <p>Mit diesem Button wird ein Testfall in der SharePoint-Liste „Fälle“ angelegt.</p>

  <button id="testWrite" type="button" disabled>
    Testfall in SharePoint anlegen
  </button>

  <pre id="testResult"></pre>

  <script src="msal-browser.min.js"></script>

  <script>
  const CFG = {
    clientId: '0fb63a5b-1b13-4e0a-8557-2539b2b96258',
    tenantId: 'a1401f5e-c83f-4acf-adcb-93291e8b26aa',
    siteHost: 'rosengutde.sharepoint.com',
    sitePath: '/sites/Reparaturen'
  };

  const SCOPES = ['User.Read', 'Sites.ReadWrite.All'];

  const out = document.getElementById('out');
  const testButton = document.getElementById('testWrite');
  const testResult = document.getElementById('testResult');

  (async () => {
    // MSAL initialisieren
    const app = new msal.PublicClientApplication({
      auth: {
        clientId: CFG.clientId,
        authority: 'https://login.microsoftonline.com/' + CFG.tenantId,
        redirectUri: location.origin + location.pathname
      },
      cache: {
        cacheLocation: 'localStorage'
      }
    });

    await app.initialize();

    // Anmeldung verarbeiten
    const redirectResult = await app.handleRedirectPromise();
    const account =
      (redirectResult && redirectResult.account) ||
      app.getAllAccounts()[0];

    if (!account) {
      out.textContent = 'Weiterleitung zur Microsoft-Anmeldung …';
      await app.loginRedirect({ scopes: SCOPES });
      return;
    }

    // Zugriffstoken holen
    let tokenResult;

    try {
      tokenResult = await app.acquireTokenSilent({
        scopes: SCOPES,
        account: account
      });
    } catch (error) {
      await app.acquireTokenRedirect({
        scopes: SCOPES,
        account: account
      });
      return;
    }

    // Hilfsfunktion für Microsoft Graph
    async function graphRequest(url, options = {}) {
      const response = await fetch(
        'https://graph.microsoft.com/v1.0' + url,
        {
          ...options,
          headers: {
            Authorization: 'Bearer ' + tokenResult.accessToken,
            'Content-Type': 'application/json',
            ...(options.headers || {})
          }
        }
      );

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          data.error?.message ||
          JSON.stringify(data) ||
          'Microsoft Graph Fehler: ' + response.status
        );
      }

      return data;
    }

    // Benutzer und SharePoint-Website abrufen
    const me = await graphRequest('/me');

    const site = await graphRequest(
      '/sites/' + CFG.siteHost + ':' + CFG.sitePath
    );

    if (!site.id) {
      throw new Error('SharePoint-Website wurde nicht gefunden.');
    }

    // Listen abrufen
    const lists = await graphRequest(
      '/sites/' + site.id + '/lists?$select=id,displayName'
    );

    const casesList = lists.value.find(
      list => list.displayName === 'Fälle'
    );

    if (!casesList) {
      throw new Error('Die SharePoint-Liste „Fälle“ wurde nicht gefunden.');
    }

    // Anmeldetest anzeigen
    out.textContent = JSON.stringify({
      angemeldet: me.displayName,
      mail: me.mail || me.userPrincipalName,
      website: site.displayName,
      liste: casesList.displayName,
      status: 'Verbindung erfolgreich'
    }, null, 2);

    // Schreibtest aktivieren
    testButton.disabled = false;

    testButton.addEventListener('click', async () => {
      testButton.disabled = true;
      testResult.textContent = 'Test wird ausgeführt …';

      try {
        // Aktuelles Zugriffstoken erneuern bzw. abrufen
        const freshToken = await app.acquireTokenSilent({
          scopes: SCOPES,
          account: account
        });

        tokenResult = freshToken;

        // Testfall in SharePoint anlegen
        const created = await graphRequest(
          '/sites/' + site.id + '/lists/' + casesList.id + '/items',
          {
            method: 'POST',
            body: JSON.stringify({
              fields: {
                Title: 'TEST – Reparaturmeldung',
                Bereich: 'Sonstiges',
                Beschreibung: 'Automatischer Schreibtest',
                Prioritaet: 'Mittel',
                Status: 'Neu',
                Melder: account.username,
                MelderName: account.name || account.username
              }
            })
          }
        );

        testResult.textContent =
          'Erfolgreich angelegt!\n' +
          'SharePoint-ID: ' + created.id;

      } catch (error) {
        testResult.textContent =
          'Fehler beim Schreibtest:\n' + error.message;

      } finally {
        testButton.disabled = false;
      }
    });

  })().catch(error => {
    out.textContent = 'Fehler: ' + error.message;
  });
  </script>
</body>
</html>
