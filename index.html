
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reparaturmeldungen – Anmeldetest</title>
</head>
<body>
  <h1>Reparaturmeldungen</h1>
  <pre id="out">Microsoft-Anmeldung wird vorbereitet …</pre>

  <script src="msal-browser.min.js"></script>
  <script>
    const CFG = {
      clientId: '7161a990-f25a-45fa-9b59-3ffd5794e0b8',
      tenantId: 'a1401f5e-c83f-4acf-adcb-93291e8b26aa'
    };

    // Nur die grundlegende Anmeldung, keine SharePoint-Rechte.
    const SCOPES = ['User.Read'];
    const out = document.getElementById('out');

    async function starten() {
      const app = new msal.PublicClientApplication({
        auth: {
          clientId: CFG.clientId,
          authority:
            'https://login.microsoftonline.com/' + CFG.tenantId,
          redirectUri: location.origin + location.pathname
        },
        cache: {
          cacheLocation: 'localStorage'
        }
      });

      await app.initialize();

      const result = await app.handleRedirectPromise();
      const account =
        (result && result.account) || app.getAllAccounts()[0];

      if (!account) {
        out.textContent = 'Weiterleitung zur Microsoft-Anmeldung …';
        await app.loginRedirect({ scopes: SCOPES });
        return;
      }

      let token;

      try {
        token = await app.acquireTokenSilent({
          scopes: SCOPES,
          account
        });
      } catch (e) {
        out.textContent = 'Microsoft-Anmeldung wird fortgesetzt …';
        await app.acquireTokenRedirect({
          scopes: SCOPES,
          account
        });
        return;
      }

      const response = await fetch(
        'https://graph.microsoft.com/v1.0/me',
        {
          headers: {
            Authorization: 'Bearer ' + token.accessToken
          }
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error?.message || 'Benutzerabfrage fehlgeschlagen.'
        );
      }

      out.textContent =
        'Anmeldung erfolgreich!\n\n' +
        'Name: ' + (data.displayName || 'Nicht verfügbar') + '\n' +
        'E-Mail: ' + (data.mail || data.userPrincipalName || 'Nicht verfügbar') +
        '\n\nDer nächste Schritt ist die Verbindung zu Google Sheets.';
    }

    starten().catch(error => {
      out.textContent =
        'Anmeldung fehlgeschlagen:\n' +
        error.message +
        '\n\nFalls eine Administratorgenehmigung verlangt wird, ' +
        'muss möglicherweise eure IT die Anmeldung freigeben.';
    });
  </script>
</body>
</html>
